services:
  postgres:
    image: postgres:18-alpine
    container_name: greenatom-case3-postgres
    restart: unless-stopped
    env_file:
      - ./config/.env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    # build-стейдж: в нём есть sequelize-cli (devDependencies)
    build:
      context: .
      target: build
    image: greenatom-case-3-migrate
    env_file: config/.env.production
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_ENV: production
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: greenatom-case-3
    env_file: config/.env.production
    environment:
      # порт внутри контейнера фиксирован, наружу пробрасывается ниже
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
