services:
  postgres:
    image: postgres:18-alpine
    container_name: greenatom-case3-postgres
    restart: unless-stopped
    env_file:
      - ./config/.env.production
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    image: greenatom-case-2
    env_file: config/.env.production
    environment:
      # порт внутри контейнера фиксирован, наружу пробрасывается ниже
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # JSON-база переживает пересоздание контейнера
      - api-data:/app/dist/repos/common
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres-data:
  api-data:
