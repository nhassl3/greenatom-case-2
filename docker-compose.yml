services:
  api:
    build: .
    image: greenatom-case-2
    env_file: config/.env.production
    environment:
      # порт внутри контейнера фиксирован, наружу пробрасывается ниже
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      # JSON-база переживает пересоздание контейнера
      - api-data:/app/dist/repos/common
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  api-data:
